<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="images/kielo-favicon.png" />

    <title>Kielo Beauty | Natural Nails in Vantaa</title>
    <meta
      name="description"
      content="Kielo Beauty is a calm nail studio in Vantaa, focused on BIAB, natural nails and clean beauty."
    />

    <link rel="stylesheet" href="style.css?v=1" />
  </head>

  <body>
    <main class="landing">
      <!-- Left information panel -->
      <section class="info-panel">
        <header class="brand">
          <div class="language-switch">
            <a href="fi.html">FI</a>
            <span>|</span>
            <a href="index.html" class="active">EN</a>
          </div>
          <a href="#">
            <img
              src="images/kielo-logo.png"
              alt="Kielo Spa"
              class="logo-image"
            />
          </a>

          <p class="brand-tagline">BIAB · NATURAL NAILS</p>
        </header>

        <div class="studio-info">
          <p class="label">Address</p>
          <p>
            <a
              href="https://maps.app.goo.gl/MW8Fac49rvRD2aLV8?g_st=iw"
              target="_blank"
              rel="noopener"
            >
              Kielo Beauty<br />
              Laajavuorenkuja 8<br />
              01620 Vantaa
            </a>
          </p>

          <p class="label">Phone</p>

          <p>
            <a href="tel:+358413180932"> 041 318 0932 </a>
          </p>

          <div class="appointment-block">
            <p class="label">Appointments</p>

            <p>
              <a
                href="book.html"
                target="_blank"
                rel="noopener"
                class="booking-link"
              >
                Book Now →
              </a>
            </p>
          </div>
        </div>

        <div class="bottom-info">
          <p>By appointment only</p>

          <p>
            Instagram ·
            <a
              href="https://www.instagram.com/kielobeautyfi/"
              target="_blank"
              rel="noopener"
            >
              @kielobeautyfi
            </a>
          </p>
        </div>
      </section>

      <!-- Right hero image -->
      <a class="image-panel" href="portfolio.html" aria-label="View portfolio">
        <img
          src="images/kielo-nails-hero.webp"
          alt="Natural BIAB nails by Kielo Beauty"
        />
        <span class="image-cta">View Portfolio →</span>
      </a>
    </main>
    <a href="book.html" class="mobile-sticky-cta"> Book Now </a>
    <div class="cookie-banner" id="cookie-banner">
      <p>
        We use cookies to understand how visitors use our website and improve
        the experience.
      </p>

      <div class="cookie-actions">
        <button type="button" id="cookie-decline">Decline</button>
        <button type="button" id="cookie-accept">Accept</button>
      </div>
    </div>

    <script src="cookies.js"></script>
  </body>
</html>
